<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta charset="utf-8" />
    <title>AR 虛擬道具收集</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; touch-action: none; }
      
      #intro-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #1a2a3a; z-index: 9999; display: flex; justify-content: center; align-items: center;
        color: white; transition: opacity 0.3s;
      }
      .intro-card { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; text-align: center; }
      .btn { background: #00e6ff; padding: 12px 24px; font-size: 18px; border-radius: 30px; border: none; font-weight: bold; margin-top: 15px; cursor: pointer;}
      
      #ui-layer {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 1000; display: none;
      }
      
      #backpack-btn {
        position: fixed; bottom: 80px; right: 20px;
        background: #ffaa00; border: 3px solid white; border-radius: 50%;
        width: 65px; height: 65px; font-size: 28px; cursor: pointer;
        pointer-events: auto; display: flex; justify-content: center; align-items: center;
      }
      
      #toast {
        position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
        background: #00ff00; color: black; padding: 10px 20px;
        border-radius: 20px; font-weight: bold; display: none;
      }

      #inventory-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #111; z-index: 9000; display: none; color: white;
        flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto;
      }
      .item-icon { width: 70px; height: 70px; background: #333; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 30px; margin-right: 15px; cursor: pointer;}
      model-viewer { width: 100%; height: 350px; background: #222; border-radius: 15px; margin-top: 15px;}
    </style>

    <script>
      let inventory = [];
      const itemDatabase = {
        'item-01': { name: '能量方塊', icon: '🧊', desc: '神秘藍色能量。', modelSrc: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb' },
        'item-02': { name: '生命寶珠', icon: '🔮', desc: '散發綠色光芒。', modelSrc: 'https://modelviewer.dev/shared-assets/models/shishkebab.glb' }
      };

      // 終極觸控修正版 Component
      AFRAME.registerComponent('collectible', {
        schema: { itemId: { type: 'string' } },
        init: function () {
          const collectItem = (e) => {
            e.stopPropagation(); // 阻止事件重疊
            const id = this.data.itemId;
            
            if (!inventory.includes(id)) {
              inventory.push(id);
              
              // 顯示提示
              const toast = document.getElementById('toast');
              toast.innerText = '獲得：' + itemDatabase[id].name;
              toast.style.display = 'block';
              setTimeout(() => toast.style.display = 'none', 2000);
              
              // 隱藏 3D 物件並移除點擊標籤
              this.el.setAttribute('visible', 'false');
              this.el.classList.remove('clickable');
            }
          };

          // 同時綁定 click 同 touchstart
          this.el.addEventListener('mousedown', collectItem);
          this.el.addEventListener('touchstart', collectItem);
        }
      });

      function startGame() {
        document.getElementById('intro-screen').style.display = 'none';
        document.getElementById('ui-layer').style.display = 'block';
      }

      function openInventory() {
        document.getElementById('inventory-screen').style.display = 'flex';
        const listDiv = document.getElementById('item-list');
        const detailDiv = document.getElementById('item-detail');
        listDiv.innerHTML = '';
        
        if(inventory.length === 0) {
          detailDiv.innerHTML = '<h3 style="color:#aaa; text-align:center;">背包係空的</h3>';
          return;
        }

        inventory.forEach(id => {
          const item = itemDatabase[id];
          const iconDiv = document.createElement('div');
          iconDiv.className = 'item-icon'; iconDiv.innerText = item.icon;
          iconDiv.onclick = () => {
            detailDiv.innerHTML = `
              <h2 style="color:#00e6ff; text-align:center;">${item.name}</h2>
              <model-viewer src="${item.modelSrc}" auto-rotate camera-controls></model-viewer>
              <p style="text-align:center;">${item.desc}</p>
            `;
          };
          listDiv.appendChild(iconDiv);
        });
        
        // 點擊第一個
        listDiv.firstChild.click();
      }

      function closeInventory() { document.getElementById('inventory-screen').style.display = 'none'; }
    </script>
  </head>
  
  <body>
    <div id="intro-screen">
      <div class="intro-card">
        <h2>AR 收集戰</h2>
        <button class="btn" onclick="startGame()">開始掃描</button>
      </div>
    </div>

    <div id="ui-layer">
      <div id="toast"></div>
      <div id="backpack-btn" onclick="openInventory()">🎒</div>
    </div>

    <div id="inventory-screen">
      <div style="display:flex; justify-content:space-between;">
        <h2>圖鑑</h2>
        <button onclick="closeInventory()" style="background:#f44; color:#fff; border:none; padding:10px; border-radius:10px;">返回</button>
      </div>
      <div id="item-list" style="display:flex; overflow-x:auto; margin-top:10px;"></div>
      <div id="item-detail"></div>
    </div>

    <!-- 加上 ?v=2 破解快取，加上 fuse: false 增強點擊判定 -->
    <a-scene 
      mindar-image="imageTargetSrc: ./image/targets.mind?v=2; maxTrack: 2;" 
      color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
      cursor="rayOrigin: mouse; fuse: false;" raycaster="objects: .clickable">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-box class="clickable" collectible="itemId: item-01" 
               position="0 0 0.25" scale="0.5 0.5 0.5" color="blue" 
               animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1">
        <a-sphere class="clickable" collectible="itemId: item-02" 
                  position="0 0 0.25" radius="0.3" color="green"
                  animation="property: position; to: 0 0.2 0.25; dir: alternate; loop: true; dur: 1000"></a-sphere>
      </a-entity>
    </a-scene>
  </body>
</html>
